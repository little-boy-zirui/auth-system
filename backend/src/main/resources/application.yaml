spring:
  datasource:
    url: jdbc:mysql://localhost:3306/authdb?useSSL=false&serverTimezone=UTC
    username: root
    password: your_mysql_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  main:
    allow-bean-definition-overriding: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath*:/mapper/**/*.xml

justauth:
  enabled: true
  type:
    # 需根据实际添加相应客户端信息
    GITHUB:
      client-id: your_github_client_id
      client-secret: your_github_client_secret
    WECHAT_OPEN:
      client-id: your_wechat_client_id
      client-secret: your_wechat_client_secret
      redirect-uri: http://localhost:8080/oauth/justauth/callback/wechat_open
    QQ:
      client-id: your_qq_client_id
      client-secret: your_qq_client_secret
      redirect-uri: http://localhost:8080/oauth/justauth/callback/qq
    DINGTALK:
      client-id: your_dingtalk_client_id
      client-secret: your_dingtalk_client_secret
      redirect-uri: http://localhost:8080/oauth/justauth/callback/dingtalk
    FEISHU:
      client-id: your_feishu_client_id
      client-secret: your_feishu_client_secret
      redirect-uri: http://localhost:8080/oauth/justauth/callback/feishu
    QYWEIXIN:
      client-id: your_qywx_client_id
      client-secret: your_qywx_client_secret
      agent-id: your_qywx_agent_id
      redirect-uri: http://localhost:8080/oauth/justauth/callback/qyweixin

server:
  port: 8080

logging:
  level:
    root: info
    com.baomidou.mybatisplus: debug
